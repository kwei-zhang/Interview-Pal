project_id = "interview-pal"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Apply migration 004 and configure the hook before enabling signup on hosted projects.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm", "http://127.0.0.1:3001/auth/confirm"]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

[auth.email.template.confirmation]
subject = "Confirm your Interview Pal account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Interview Pal password"
content_path = "./supabase/templates/recovery.html"
